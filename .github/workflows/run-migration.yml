name: Run DB migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Run migration endpoint
        run: |
          curl -s -X POST https://typer.itss.pl/api/admin/run-migration \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}" \
            -w "\nHTTP %{http_code}" \
            --max-time 60
